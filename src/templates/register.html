<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - SalonGo</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    {% include "_nav.html" %}
    <main class="auth-card">
        <h1>Create your account</h1>
        {% if error %}<p class="message err">{{ error }}</p>{% endif %}
        <form method="post" action="/register">
            <input type="hidden" name="csrf" value="{{ csrf_token() }}">
            <div class="role-options">
                <label><input type="radio" name="role" value="customer" {% if form.get('role') != 'owner' %}checked{% endif %}> I'm a customer</label>
                <label><input type="radio" name="role" value="owner" {% if form.get('role') == 'owner' %}checked{% endif %}> I own a salon</label>
            </div>
            <label>Your name<input type="text" name="name" value="{{ form.get('name', '') }}" maxlength="60" required autocomplete="name"></label>
            <label id="salonField" hidden>Salon name<input type="text" name="salon_name" value="{{ form.get('salon_name', '') }}" maxlength="60"></label>
            <label>Email<input type="email" name="email" value="{{ form.get('email', '') }}" maxlength="120" required autocomplete="email"></label>
