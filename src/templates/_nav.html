<header class="navbar">
    <a class="logo" href="/">Salon<span>Go</span></a>
    <div class="nav-links">
        {% if current_user %}
            {% if current_user.role == 'owner' %}<a href="/dashboard">Dashboard</a>
            {% elif current_user.role == 'admin' %}<a href="/admin">Admin</a>
            {% else %}<a href="/my-bookings">My bookings</a>{% endif %}
            <form method="post" action="/logout" class="inline">
                <input type="hidden" name="csrf" value="{{ csrf_token() }}">
                <button class="link-btn" type="submit">Log out ({{ current_user.name }})</button>
            </form>
        {% else %}
            <a href="/login">Log in</a>
            <a href="/register" class="btn-small">Sign up</a>
        {% endif %}
    </div>
</header>
