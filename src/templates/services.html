<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - SalonGo</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/extra.css">
</head>
<body>
    {% include "_nav.html" %}
    <main class="container">
        <p><a href="/dashboard">‚Üê Back to dashboard</a></p>
        <h1>Services &amp; prices</h1>
        {% if notice %}<p class="message {{ 'err' if error else 'ok' }}">{{ notice }}</p>{% endif %}

        {% for s in services %}
        <div class="service-row">
            <form method="post" action="/dashboard/services/save" class="service-form">
                <input type="hidden" name="csrf" value="{{ csrf_token() }}">
                <input type="hidden" name="service_id" value="{{ s.id }}">
                <input type="text" name="name" value="{{ s.name }}" maxlength="40" required aria-label="Name">
                <select name="category" aria-label="Category">
                    {% for c in categories %}<option value="{{ c }}" {% if c == s.category %}selected{% endif %}>{{ c|capitalize }}</option>{% endfor %}
                </select>
                <label>‚Çπ<input type="number" name="price" value="{{ s.price }}" min="0" max="100000" required></label>
                <label><input type="number" name="duration" value="{{ s.duration_min }}" min="5" max="480" require∂ªßq´^
